name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://exam-portal-api-255890529179.europe-west1.run.app
      NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyDEs3vvusXnC4PEXiBAgkiFdNKd_peqxMI
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: examapp-d7995.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: examapp-d7995
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:255890529179:web:7a69bf007ae8eb12fadf3e
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: examapp-d7995.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "255890529179"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/255890529179/locations/global/workloadIdentityPools/github-actions/providers/exam-repos
          service_account: github-actions-deploy@examapp-d7995.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy exam-portal \
            --source . \
            --region europe-west1 \
            --project examapp-d7995 \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80
